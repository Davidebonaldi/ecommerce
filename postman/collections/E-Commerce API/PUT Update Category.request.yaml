$kind: http-request
name: PUT Update Category
order: 5300
url: '{{base_url}}/api/categories/3'
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "name": "Casa"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has slug 'casa'", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("slug", "casa");
      });

      pm.test("Response has name 'Casa'", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("name", "Casa");
      });
