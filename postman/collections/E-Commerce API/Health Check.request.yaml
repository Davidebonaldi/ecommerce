$kind: http-request
name: 'Health Check'
order: 4000
url: '{{base_url}}/api/health'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Status is ok", function () {
          const json = pm.response.json();
          pm.expect(json.status).to.eql('ok');
      });
