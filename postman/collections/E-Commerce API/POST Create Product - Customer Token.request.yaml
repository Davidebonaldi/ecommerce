$kind: http-request
name: 'POST Create Product - Customer Token'
order: 8000
url: '{{base_url}}/api/products'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customer_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "category_id": 1,
      "name": "Tastiera meccanica",
      "description": "Switch rossi, layout italiano",
      "price": 79.90,
      "stock": 15
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.sendRequest({
          url: pm.environment.get('base_url') + '/api/auth/login',
          method: 'POST',
          header: { 'Content-Type': 'application/json' },
          body: {
              mode: 'raw',
              raw: JSON.stringify({ email: 'mario@test.it', password: 'password123' })
          }
      }, function (err, res) {
          if (!err && res.code === 200) {
              pm.variables.set('customer_token', res.json().token);
          }
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 403 - Accesso negato al customer", function () {
          pm.response.to.have.status(403);
      });
      pm.test("Body contiene messaggio accesso riservato", function () {
          const json = pm.response.json();
          pm.expect(json.message).to.include("amministratori");
      });
